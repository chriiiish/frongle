# Production on EKS. The release workflow adds the image repositories, image tags,
# database.host, and ingress.tls.email.
publicUrl: https://frongle.cjl.nz

database:
  existingSecret: frongle-db
  appExistingSecret: frongle-app-db

# Two Keycloak pods and the realm import must fit on two t3.medium nodes.
keycloak:
  resources:
    requests:
      memory: 900Mi
    limits:
      memory: 1700Mi

ingress:
  host: frongle.cjl.nz
  tls:
    enabled: true
