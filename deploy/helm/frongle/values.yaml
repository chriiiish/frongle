# Public URL that browsers use. Keycloak, the API, and the web app all sit behind it.
publicUrl: http://localhost

api:
  image:
    repository: frongle/api
    tag: latest
  replicas: 2
  port: 8080
  migrateOnStartup: true

web:
  image:
    repository: frongle/web
    tag: latest
  replicas: 2
  port: 8080

database:
  host: '' # Required when postgres.enabled is false (for example the RDS endpoint).
  port: 5432
  name: frongle
  ssl: true # Use TLS to reach the database. Turn off for the in-cluster Postgres.
  existingSecret: '' # Secret with the keys "username" and "password". Required when postgres.enabled is false.

# In-cluster Postgres for local work. Prod uses RDS instead.
postgres:
  enabled: false
  image: imresamu/postgis:17-3.5-bookworm
  username: frongle
  password: ''

keycloak:
  instances: 2
  realm: frongle
  clientId: frongle-web
  resources: {} # Kubernetes requests and limits for each Keycloak pod. Empty uses the operator defaults.
  # Users are for local work only. Each has: username, password, email, tenantId, roles.
  users: []

ingress:
  className: nginx
  host: '' # Empty matches any host. Required when tls.enabled is true.
  tls:
    enabled: false # Needs cert-manager in the cluster.
    secretName: frongle-tls
    clusterIssuer: letsencrypt
    email: '' # Let's Encrypt contact address. Required when tls.enabled is true.
