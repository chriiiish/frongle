apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ .Release.Name }}-realm
spec:
  keycloakCRName: {{ include "frongle.keycloakName" . }}
  realm:
    realm: {{ .Values.keycloak.realm }}
    enabled: true
    sslRequired: external
    loginTheme: frongle
    displayName: Frongle
    roles:
      realm:
        - name: maintenance-manager
        - name: work-team
    # "tenant_id" is a managed user attribute. Only an admin can change it.
    components:
      org.keycloak.userprofile.UserProfileProvider:
        - providerId: declarative-user-profile
          config:
            kc.user.profile.config:
              - >-
                {"attributes":[
                {"name":"username","displayName":"${username}","validations":{"length":{"min":3,"max":255}},"permissions":{"view":["admin","user"],"edit":["admin","user"]}},
                {"name":"email","displayName":"${email}","validations":{"email":{}},"required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]}},
                {"name":"firstName","displayName":"${firstName}","permissions":{"view":["admin","user"],"edit":["admin","user"]}},
                {"name":"lastName","displayName":"${lastName}","permissions":{"view":["admin","user"],"edit":["admin","user"]}},
                {"name":"tenant_id","displayName":"Tenant","permissions":{"view":["admin","user"],"edit":["admin"]}}
                ]}
    clients:
      - clientId: {{ .Values.keycloak.clientId }}
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - {{ .Values.publicUrl }}/*
        webOrigins:
          - {{ .Values.publicUrl }}
        attributes:
          pkce.code.challenge.method: S256
        protocolMappers:
          - name: tenant_id
            protocol: openid-connect
            protocolMapper: oidc-usermodel-attribute-mapper
            config:
              user.attribute: tenant_id
              claim.name: tenant_id
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "true"
    {{- with .Values.keycloak.users }}
    users:
      {{- range . }}
      - username: {{ .username }}
        enabled: true
        email: {{ .email }}
        emailVerified: true
        attributes:
          tenant_id:
            - {{ .tenantId }}
        credentials:
          - type: password
            value: {{ .password }}
            temporary: false
        realmRoles:
          {{- toYaml .roles | nindent 10 }}
      {{- end }}
    {{- end }}
