{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ required "postgres.password is required when postgres.enabled is true" .Values.postgres.password | quote }}
---
# The API serves requests as this role. It is not a superuser and cannot bypass row-level security.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-app
stringData:
  username: {{ .Values.postgres.appUsername | quote }}
  password: {{ required "postgres.appPassword is required when postgres.enabled is true" .Values.postgres.appPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
data:
  create-keycloak-database.sql: |
    CREATE DATABASE keycloak;
  create-app-role.sql: |
    CREATE ROLE {{ .Values.postgres.appUsername }} LOGIN PASSWORD '{{ .Values.postgres.appPassword }}' NOSUPERUSER NOBYPASSRLS;
    ALTER DEFAULT PRIVILEGES FOR ROLE {{ .Values.postgres.username }} IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO {{ .Values.postgres.appUsername }};
    ALTER DEFAULT PRIVILEGES FOR ROLE {{ .Values.postgres.username }} IN SCHEMA public
      GRANT USAGE, SELECT ON SEQUENCES TO {{ .Values.postgres.appUsername }};
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector:
    app: {{ .Release.Name }}-postgres
  ports:
    - port: 5432
{{- end }}
