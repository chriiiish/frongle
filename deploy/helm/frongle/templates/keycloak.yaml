apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: {{ include "frongle.keycloakName" . }}
spec:
  instances: {{ .Values.keycloak.instances }}
  db:
    vendor: postgres
    host: {{ include "frongle.dbHost" . }}
    port: {{ .Values.database.port }}
    database: keycloak
    usernameSecret:
      name: {{ include "frongle.dbSecret" . }}
      key: username
    passwordSecret:
      name: {{ include "frongle.dbSecret" . }}
      key: password
  {{- with .Values.keycloak.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  http:
    httpEnabled: true
  hostname:
    hostname: {{ .Values.publicUrl }}/auth
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  unsupported:
    podTemplate:
      spec:
        containers:
          - volumeMounts:
              - name: frongle-theme
                mountPath: /opt/keycloak/themes/frongle/login
        volumes:
          - name: frongle-theme
            configMap:
              name: {{ .Release.Name }}-keycloak-theme
              items:
                - key: theme.properties
                  path: theme.properties
                - key: frongle.css
                  path: resources/css/frongle.css
                - key: logo.svg
                  path: resources/img/logo.svg
  additionalOptions:
    - name: http-relative-path
      value: /auth
    # Keep the public issuer, but give server-to-server callers (the API) internal endpoint URLs.
    - name: hostname-backchannel-dynamic
      value: "true"
    {{- if .Values.database.ssl }}
    - name: db-url-properties
      value: "?sslmode=require"
    {{- end }}
